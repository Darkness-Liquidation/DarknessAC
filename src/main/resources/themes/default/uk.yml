# Доступні плейсхолдери:
# %time% - Поточний час (Обовзязковий плейсхолдер до логу)
# %server_name% - Назва сервера
# %player% - Нікнейм гравця
# %ip% - IP-адреса гравця
# %uuid% - Унікальний ідентифікатор гравця
# %check_name% - Назва перевірки
# %verbose% - Додаткова інформація з перевірки. Не всі перевірки додають цю інформацію
# %vl% - Кількість порушень
# %bar% — кількість порушень у вигляді бара
# %trust_color% - Колір порушення
# %trust_name% - Кольорове ім'я порушення
# %check% - Назва перевірки без типу
# %check_type% - Назва типу чеку
# %ping% - Пінг гравця
# %tps% - Поточний TPS
# %component% - Модуль вигнання (Тільки для клієнта)
# %brand% - Клієнтський бренд гравця (наприклад, Vanilla, Lunar-Client, Forge)
# %version% - Версія гри клієнта (наприклад, 1.16.5)
# %lagstatus% - Статус лагів у гравця
# %h_sensitivity% - Горизонтальна чутливість миші гравця (у %)
# %v_sensitivity% - Вертикальна чутливість миші гравця (у %)
# %fast_math% - Чи використовує гравець FastMath (true/false)
# %prefix% - Стандартний префікс плагіна
# %darkness_version% - Поточна версія античита Darkness
# %nl% - Перенесення рядка (новий рядок)
# %max_vl% - Максимальна кількість порушень до кіка/бану
# %experimental% - Знак (Experimental) якщо перевірка тестова
# %description% - Опис роботи перевірки
# %information% - Технічна інформація про хітбокси
brand_log_format: "(%time%) %server_name%: %player% (%ip%) був вигнаний за бренд: %brand% | component: %component%"
log_format: "(%time%) %server_name%: %player% (%ip%) провалив %check% | (%verbose%) | vl: %vl% ping: %ping% tps: %tps%"
command_log_format: "(%time%) %server_name%: Execute command: %command%"
alerts_format: "%prefix% &c%player% &7провалив &c%check_name%%experimental% &7(x&c%bar%&7)"
alerts_format_console: "%prefix% &c%player% &7провалив &c%check_name%%experimental% &7(x&c%vl%&7) &c%verbose%"
alerts_format_proxy: "%prefix% &f[&cPROXY&f] &f%player% &7провалив &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"

