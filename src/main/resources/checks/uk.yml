## Timer Check
Timer:

  # Timer A Module
  a:

    # Should we enable this module?
    enabled: true
    # Мілісекунди, які гравець може накопичувати для подальшого використання, коли він відстає.
    # Потенційно може дозволити обхід 1.8: швидке використання/швидке лікування/швидкий лук, якщо значення занадто високе — 120 мс здається хорошим балансом
    drift: 120
    # Пінг, при якому перевірка почне обмежувати баланс таймера, щоб запобігти зловживанням.
    # Може викликати деяку затримку у чесних гравців, але тільки якщо їхній пінг перевищує цей поріг.
    # -1 для вимкнення
    ping_abuse_limit_threshold: 1000

  # Should we enable this module?
  b: true

  # Timer C Module
  c:

    # Should we enable this module?
    enabled: true
    # Мінімальна швидкість таймера (Звичайна швидкість: 1200), однак лаги та інші особливості можуть підвищити її (приблизно до 2100)
