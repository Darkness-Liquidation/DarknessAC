## Chat Check
Chat:

  # Chat A Module
  a:

    # Should we enable this module?
    enabled: true
    # Максимальна швидкість відправлення повідомлення гравцем
    maxDelay: 115

  # Chat B Module
  b:

    # Should we enable this module?
    enabled: true
    # Максимальна похибка в інтервалі відправлення повідомлення гравцем
    maxDelta: 5

  # Chat C Module
  c:

    # Should we enable this module?
    enabled: true

    # Мінімальна схожість рядків, які Darkness буде вважати подібними
    # -1 для вимкнення
    max_similarity: 0.8
    # Максимальна різниця в довжині рядків для перевірки на схожість
    max_similarity_chardiff: 4

    # Максимальний відсоток великих літер у повідомленнях коротших за 6 символів
    # -1 для вимкнення
    max_caps_percentage_s: 0.6
    # Максимальний відсоток великих літер у повідомленнях довших за 5 символів
    max_caps_percentage_l: 0.525

  # Should we enable this module?
  d: true

  # Chat E Module
  e:

    # Should we enable this module?
    enabled: true

    # Регулярний вираз для виключення повідомлень і команд з перевірки
    exempt_regex: '(?i)^(?:\/)?(?:gg|hf|gl|wp|gf|glhf|ez)(?:[!?. ]*)$'

  # Should we enable this module?
  f: true

  # Should we enable this module?
  g: true

  setback_type: NONE
  setback_vl: -1

## Exploit Check
Exploit:

  # Should we enable this module?
  a: true # Log4j

  # Should we enable this module?
  b: true # ItemName

  # Should we enable this module?
  c: true # Book Crasher

  # Should we enable this module?
  d: true # Packet Data Crasher

  # Should we enable this module?
  e: true # WorldEdit Crasher

  # Ви можете досягати високих швидкостей, стрибаючи у спринті з елітрою. Це запобігає експлуатації, якщо параметр встановлено в значення false.
  # Mojang зіпсували мережевий код, зробивши початок польоту з елітрою клієнтським, а його завершення — серверним.
  # Елітри мають 0.99 горизонтального тертя, тому постійне додавання 0.2 до горизонтальної швидкості призводить до дуже високих швидкостей.
  allow_sprint_jumping_when_using_elytra: true
  # Ця опція пом’якшує розміщення гравця на «примарних» блоках, повторно синхронізуючи його, коли це трапляється.
  allow_building_on_ghostblocks: false
  # Цей параметр, що залежить від попереднього, визначає відстань для перевірки «примарних» блоків.
  # Допустимий діапазон значень: від 2 до 4.
  distance_to_check_if_ghostblocks: 2
  # Максимальна допустима висота, на яку гравець може піднятись при зіткненні з човном,
  # перш ніж Даркнесс вважатиме це спробою використання BoatFly
  allow_offset_boat_collision: 0.012
  # Вмикайте, якщо хочете закрити лазівки для CreativeFly aka DragonFly.
  allow_flying_checks:
    # Чи має Darkness перевіряти ліміти швидкості у польоті?
    enabled: true
    # Якою має бути похибка, щоб ми вважали це за порушення?
    # Врахуйте, що кастомні клієнти типу Lunar можуть давати хибні спрацювання,
    # тому підкручуйте значення під свій проєкт та аудиторію.
    offset: 0.05

  setback_type: NONE
  setback_vl: -1

