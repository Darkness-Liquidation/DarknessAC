    # Для якого відхилення від руху гравця ми маємо створити порушення?
    # Вимірюється в блоках від можливого руху
    offset: 0.1
    # Виправляє проблему десинхронізації при стрибку з відкритими контейнерами або блоками
    fix_jump_desync: true

  # Should we enable this module? (AutoPotion)
  c: true

