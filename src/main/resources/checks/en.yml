## Timer Check
Timer:

  # Timer A Module
  a:

    # Should we enable this module?
    enabled: true
    # Milliseconds that a player can accumulate for later use when they are lagging.
    # Potentially allows 1.8 bypasses: fast use/fast heal/fast bow if set too high — 120ms seems to be a good balance
    drift: 120
    # Ping at which the check starts to limit timer balance to prevent abuse.
    # May cause some delay for legitimate players, but only if their ping exceeds this threshold.
    # -1 to disable
    ping_abuse_limit_threshold: 1000

  # Should we enable this module?
  b: true

  # Timer C Module
  c:

    # Should we enable this module?
    enabled: true
    # Minimum timer speed (Normal speed: 1200), but lag and other factors can increase it (around 2100)
    min_speed: 2100

  # Should we enable this module?
  d: true

