## KillAura Check
KillAura:

  # Should we enable this module?
  a: true

  # KillAura B Module
  # The module will create a fake player behind the real one to determine if they are using KillAura.
  # Don't worry, the player will only see their own bot.
  b:

    # Should this module be enabled?
    enabled: true
    # Should the bot only be created by command? If true, the bot will only appear after using the command,
    # and not automatically during combat.
    only_command_trigger: true
    # Time (in milliseconds, 1000 ms = 1 second) during which the bot is visible after hitting an entity.
    living_time: 5000
    # Should Darkness always create a fake bot? This fixes some compatibility issues,
    # but allows some AntiBot modules to bypass it.
    only_random_name: false
    # Should Darkness copy the attacked entity?
    # Used to fix KillAura with a trigger only for mobs.
    # If set to false, the bot will always attack the player.
    # For the function to work, you need to set false in only_random_name to apply this value!
    copy_attack_type: true
    # Which player type to use for creating the bot?
    # 1. offline - uses offline players who have joined the server
    # 2. online - uses online players currently on the server: on 1.8-1.16 with real UUID, on 1.17+ with random UUID
    # ONLINE mode is more realistic but can be bypassed on 1.17+ versions due to random UUID
    copy_player_type: offline
    # Should the bot smoothly fly to the player when spawning?
    # The bot will spawn at a distance and quickly fly up behind the player's back.
    # If false, the bot will instantly appear directly behind the back.
    # This prevents certain AntiBot module bypasses.
    spawn_glide: true
    # Should the bot use realistic strafes?
    # The bot will stop shaking chaotically and start moving smoothly,
    # mimicking the momentum and movement logic of a real player.
    # This makes the bot's path look natural, preventing smart
    # AntiBot modules from bypassing it.
    move_strafe: true
    # Should Darkness always copy the player's equipment? This fixes some bypasses.
    copy_inventory: true
    # Should the bot take damage from the player? If true, the bot loses HP when hit.
    bot_hit_damage: true
    # Should the bot attack the player? If true, the bot will simulate attacks on the player.
    bot_attack: true
    # Bot correction mode:
    # 1. free - The bot follows the player’s movement, may go underground
    # 2. strong - The bot stays at a fixed height, never goes underground
    correction_mode: free
    # At what height should the bot be? Anything below 2.7 may affect PvP, anything above 4.5 may be out of reach.
    min_height: 4.4
    max_height: 6
    jump_multiple: 0.75
    # What movement speed will the bot have? Values below 0.7 may affect PvP (maximum: 1.0).
    motion_speed: 1.0
    # At what distance should the bot be (on the x and y axes)?
    min_distance: 3.3
    max_distance: 5
    # At what angle should the bot be relative to the player's direction?
    angle: 0
    # Set the value >= 100 to disable bot descent; this will eliminate some bypasses.
    down_probability: 150

  # Should we enable this module?
  c: true

  # Should we enable this module?
  d: true

  # Should we enable this module?
  e: true

  # KillAura F Module
  f:

    # Should we enable this module?
    enabled: true
    # How should Darkness handle hits through hatches, doors, and other objects (bug abuse)?
    # 1. none - do nothing
    # 2. cancel - cancel the attack and notify (Recommended)
    # 3. flag - set damage to zero and flag the incident
    cancel_way: cancel

  # Should we enable this module?
  g: true

  # Should we enable this module?
  h: true

  # Should we enable this module?
  i: true

  # Should we enable this module?
  j: true

  # Should we enable this module?
  k: true

  # Should we enable this module?
  l: true

  # Should we enable this module?
  m: true

  # Should we enable this module?
  n: true

  # Should we enable this module?
  o: true

  # Should we enable this module?
  p: true

  # Should we enable this module?
  q: true

  setback_type: CANCEL_ATTACK
  setback_vl: 2

