## Aim Check
Aim:

  # Enable/Disable check types and subtypes
  #
  # There are two formats:
  # 1) Short:
  #    a: true / false   # controls the whole type (all subtypes together)
  #
  # 2) Expanded:
  #    a:
  #      enabled: true   # base state of the type
  #      a: false        # specific subtype
  #      b: true         # another subtype
  #
  # Priority:
  # - Expanded format overrides short format.
  # - Subtype always overrides enabled.
  # - If the type is not specified — default value is used.
  #
  # Example:
  # Aim:
  #
  #   # Should this module be enabled?
  #   a: true          # category type enabled along with its subtypes
  #
  #   # Should this module be enabled?
  #   b: false         # same, but now disabled
  #
  #   # Aim C Module
  #   c:
  #
  #     # Should this module be enabled?
  #     enabled: true  # type "c" enabled
  #     a: false       # but subtype "a" disabled
  # Should we enable this module?
  a: true

  # Should we enable this module?
  b: true

  # Should we enable this module?
  d: true

  # Should we enable this module?
  e: true

  # Aim F Module
  f:

    # Should we enable this module?
    enabled: true
    # At what angle must the crosshair sharply flick back and forth to be considered a cheat?
    delta: 25.0

  # Should we enable this module?
  g: true

  # Should we enable this module?
  i: true

  # Should we enable this module?
  j: true

  # Should we enable this module?
  k: true

  # Should we enable this module?
  l: true

  # Should we enable this module?
  m: true

  # Should we enable this module?
  n: true

  # Should we enable this module?
  o: true

  # Should we enable this module?
  p: true

  # Should we enable this module?
  q: true

  # Should we enable this module?
  r: true

  # Should we enable this module?
  s: true

  # Should we enable this module?
  t: true

  # Should we enable this module?
  u: true

  # Should we enable this module?
  v: true

  # Should we enable this module?
  w: true

  # Should we enable this module?
  x: true

  # List of possible setback types:
  # TRUST (Dynamic trust factor based setback),
  # INVENTORY_CLOSE, ELYTRA_CLOSE, NCP, DARKNESS,
  # CANCEL_ATTACK, GRIM, FOOD, DAMAGE_REDUCE, NONE
  #
  # The setback_type setting allows combining multiple setbacks at once
  # by listing them separated by commas, for example:
  # setback_type: CANCEL_ATTACK,DARKNESS
  #
  # In this case, when setback_vl is exceeded, all specified setbacks
  # will be applied in the given order, one after another.
  #
  # Priority of settings:
  # 1) If a specific setback is defined for a check type (e.g., Aim.type.setback_type),
  #    it will be used.
  # 2) If not, the setting is searched by check category (e.g., Aim.setback_type).
  # This helps avoid duplication and allows fine-tuning of behavior.
  #
  # Example of a custom setback for type "w":
  # Aim:
  #   w:
  #     enabled: true
  #     setback_type: CANCEL_ATTACK, DARKNESS
  #     setback_vl: 3
  setback_type: CANCEL_ATTACK
  setback_vl: 2

