## Chat Check
Chat:

  # Chat A Module
  a:

    # Should we enable this module?
    enabled: true
    # Максимальная скорость отправки сообщения игроком
    maxDelay: 115

  # Chat B Module
  b:

    # Should we enable this module?
    enabled: true
    # Максимальная погрешность в интервале отправки сообщения игроком
    maxDelta: 5

  # Chat C Module
  c:

    # Should we enable this module?
    enabled: true

    # Минимальное совпадение строк, которые Даркнесс будет считать похожими
    # -1 для отключения
    max_similarity: 0.8
    # Максимальная разница в длине строк для проверки на схожесть
    max_similarity_chardiff: 4

    # Максимальный процент заглавных букв в сообщениях короче 6 символов
    # -1 для отключения
    max_caps_percentage_s: 0.6
    # Максимальный процент заглавных букв в сообщениях длиннее 5 символов
    max_caps_percentage_l: 0.525

  # Should we enable this module?
  d: true

  # Chat E Module
  e:

    # Should we enable this module?
    enabled: true

    # Регулярное выражение для исключения сообщений и команд из проверки
    exempt_regex: '(?i)^(?:\/)?(?:gg|hf|gl|wp|gf|glhf|ez)(?:[!?. ]*)$'

  # Should we enable this module?
  f: true

  # Should we enable this module?
  g: true

  setback_type: NONE
  setback_vl: -1

## Exploit Check
Exploit:

  # Should we enable this module?
  a: true # Log4j

  # Should we enable this module?
  b: true # ItemName

  # Should we enable this module?
  c: true # Book Crasher

  # Should we enable this module?
  d: true # Packet Data Crasher

  # Should we enable this module?
  e: true # WorldEdit Crasher

  # Вы можете достигать высоких скоростей, прыгая в спринте с элитрой. Это предотвращает эксплуатацию, если параметр установлен в значение false.
  # Mojang испортили сетевой код, сделав начало полета на элитрах клиентским, а его завершение серверным.
  # Элитры принимают 0.99 горизонтального трения, поэтому постоянное добавление 0.2 к горизонтальной скорости приводит к очень высоким скоростям.
  allow_sprint_jumping_when_using_elytra: true
  # Эта опция смягчает размещение игрока на блоках-призраках, ресинхронизируя его, когда это происходит.
  allow_building_on_ghostblocks: false
  # Эта настройка, зависящая от вышеуказанного параметра, определяет расстояние для проверки призрачных блоков.
  # Допустимый диапазон значения: от 2 до 4.
  distance_to_check_if_ghostblocks: 2
  # Максимальная допустимая высота, на которую игрок может подняться при столкновении с лодкой,
  # прежде чем Darkness сочтет это попыткой использования BoatFly
  allow_offset_boat_collision: 0.012
  # Включайте, если хотите прикрыть лазейки для CreativeFly aka DragonFly.
  allow_flying_checks:
    # Нужно ли Darkness проверять лимиты скорости в полете?
    enabled: true
    # Какая должна быть погрешность, чтобы мы посчитали это за нарушение?
    # Учтите, что кастомные клиенты вроде Lunar могут подкидывать ложные срабатывания,
    # так что крутите значение под свой проект и аудиторию.
    offset: 0.05

  setback_type: NONE
  setback_vl: -1

