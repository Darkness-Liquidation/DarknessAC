## Timer Check
Timer:

  # Timer A Module
  a:

    # Should we enable this module?
    enabled: true
    # Миллисекунды, которые игрок может накапливать для последующего использования, когда он отстает.
    # Потенциально может позволить 1.8 обходов: быстрое использование/быстрое исцеление/быстрый лук, если установлено слишком высокое значение, 120 мс кажется хорошим балансом
    drift: 120
    # Пинг, при котором проверка начнет ограничивать баланс таймера, чтобы предотвратить злоупотребления.
    # Может вызвать некоторые задержки для законных игроков, но только если их пинг превышает этот порог.
    # -1 для отключения
    ping_abuse_limit_threshold: 1000

  # Should we enable this module?
  b: true

  # Timer C Module
  c:

    # Should we enable this module?
    enabled: true
    # Минимальная скорость таймера (Нормальная скорость: 1200), однако лаги и другие особенности могут сделать её выше (около 2100)
    min_speed: 2100

  # Should we enable this module?
  d: true

  setback_type: NONE
  setback_vl: -1

