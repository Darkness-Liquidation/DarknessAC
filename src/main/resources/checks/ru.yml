## KillAura Check
KillAura:

  # Should we enable this module?
  a: true

  # KillAura B Module
  # Модуль будет создавать фальшивого игрока позади настоящего, чтобы определить, использует ли он KillAura
  # Не переживайте, игрок будет видеть только своего собственного бота.
  b:

    # Should we enable this module?
    enabled: true
    # Нужно ли создавать бота только по команде? Если true, бот появится только после использования команды,
    # а не автоматически во время боя.
    only_command_trigger: true
    # Время (в миллисекундах, 1000 мс = 1 секунда), в течение которого бот видим после удара по сущности.
    living_time: 5000
    # Должна ли Даркнесс всегда создавать поддельного бота, это исправляет некоторые проблемы с несовместимостью,
    # но позволяет обходить некоторым AntiBot модулям.
    only_random_name: false
    # Должна ли Даркнесс копировать атакуемую сущность?
    # Используется для исправления KillAura с триггером только по мобам.
    # Если установлено в false, бот всегда будет атаковать игрока.
    # Чтобы функция работала, нужно установить false в only_random_name, чтобы применить это значение!
    copy_attack_type: true
    # Какой тип игроков использовать для создания бота?
    # 1. offline - использует офлайн-игроков, которые заходили на сервер
    # 2. online - использует онлайн-игроков, которые сейчас на сервере: на 1.8-1.16 с реальным UUID, на 1.17+ с рандомным UUID
    # ONLINE режим более реалистичен, но может быть обойден на версиях 1.17+ из-за рандомного UUID
    copy_player_type: offline
    # Должен ли бот плавно прилетать к игроку при появлении?
    # Бот заспавнится вдалеке и быстро подлетит к спине игрока.
    # Если false, бот будет мгновенно появляться прямо за спиной.
    # Это предотвратит некоторые обходы AntiBot модулям
    spawn_glide: true
    # Должен ли бот использовать реалистичные стрейфы?
    # Бот перестанет хаотично трястись и начнет двигаться плавно,
    # имитируя инерцию и логику движений реального игрока.
    # Это делает траекторию бота естественной, что не позволяет умным
    # AntiBot модулям его обходить.
    move_strafe: true
    # Должна ли Даркнесс всегда копировать снаряжение игрока? Это исправляет некоторые обходы.
    copy_inventory: true
    # Должен ли бот получать урон от игрока? Если true, бот теряет ХП при ударе.
    bot_hit_damage: true
    # Должен ли бот сам атаковать игрока? Если true, бот будет симулировать атаки по игроку.
    bot_attack: true
    # Режим коррекции бота:
    # 1. free - Бот следует за движением игрока, может уходить под землю
    # 2. strong - Бот остается на фиксированной высоте, никогда не уходит под землю
    correction_mode: free
    # На какой высоте должен быть бот, всё ниже 2.7 может повлиять на PvP, всё выше 4.5 может быть вне досягаемости.
    min_height: 4.4
    max_height: 6
    jump_multiple: 0.75
    # Какая скорость движения будет у бота? Значение ниже 0.7 может повлиять на PvP (максимум: 1.0).
    motion_speed: 1.0
    # На каком расстоянии должен быть бот (по осям x и y)?
    min_distance: 3.3
    max_distance: 5
    # Под каким углом бот должен быть относительно направления игрока?
    angle: 0
    # Установите значение >= 100, чтобы отключить спуск бота, это устранит некоторые обходы.
    down_probability: 150

  # Should we enable this module?
  c: true

  # Should we enable this module?
  d: true

  # Should we enable this module?
  e: true

  # KillAura F Module
  f:

    # Should we enable this module?
    enabled: true
    # Как Даркнесс должна обрабатывать удары через люки, двери и другие объекты (багаюз)?
    # 1. none - ничего не делать
    # 2. cancel - отменить атаку и оповещать (Рекомендуется)
    # 3. flag - установить урон в ноль и флагировать
    cancel_way: cancel

  # Should we enable this module?
  g: true

  # Should we enable this module?
  h: true

  # Should we enable this module?
  i: true

  # Should we enable this module?
  j: true

  # Should we enable this module?
  k: true

  # Should we enable this module?
  l: true

  # Should we enable this module?
  m: true

  # Should we enable this module?
  n: true

  # Should we enable this module?
  o: true

  # Should we enable this module?
  p: true

  # Should we enable this module?
  q: true

  setback_type: CANCEL_ATTACK
  setback_vl: 2

