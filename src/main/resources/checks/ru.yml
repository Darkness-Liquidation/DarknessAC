  # Inventory G Module
  g:

    # Should we enable this module?
    enabled: true
    # Включите, если вы разрешаете использование сенсорного режима или игру с Bedrock.
    # Это поможет предотвратить ложные флаги при быстром перемещении предметов в инвентаре.
    sensor_mode: false
    setback_vl: 3

  # Inventory H Module (ChestStealer)
  h:

    # Should we enable this module?
    enabled: true
    # Минимальное среднее значение задержки в миллисекундах между кликами, необходимое для срабатывания этой проверки
    delta: 40

  # Inventory I Module (InventoryCleaner)
  i: true

  # Inventory J Module
  j:

    # Should we enable this module?
    enabled: true
    setback_type: TRUST

  # Should we enable this module?
  k: true

  # Should we enable this module? (InvalidClose)
  l: true

  # Должны ли мы включить этот модуль? (EntityAction)
