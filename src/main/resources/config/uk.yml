# License Settings
license:

  # Ваш ліцензійний ключ (надається при покупці)
  api-key: "null"

  # Сервер API Darkness
  api-server: "https://api.darkness.rip/"

# Чи увімкнути тестовий режим?
# Якщо цей режим увімкнено, команди покарання, ротації та перемішування слотів не працюватимуть
test_mode: false

# Тема оформлення, яку використовуватиме Darkness
theme: default

# Назва сервера, що відображатиметься в логах та повідомленнях Discord
server_name: Darkness Server

# Вкажіть назви команд для Darkness через кому
# Перше ім'я у списку стане основною командою плагіна
# Зміни застосовуються лише після перезавантаження сервера
command_name: darkness,dl

# Discord Sync Settings
discord:

  # Чи синхронізувати Darkness з вашим сервером Discord через вебхук?
  enabled: false

  # Вставте URL вебхука каналу Discord
  webhook_url: ""

  # Заголовок повідомлення про виявлення
  embed_title: "**:fire: NEW CHEATER DETECTED!**"

  # Колір смуги ліворуч від повідомлення (HEX-формат)
  embed_color: "#ff0000"

  # Вміст повідомлення про порушення
  violation_content:
    - "%player%"
    - ""
    - ":shield: **Server Name:**"
    - "%server_name%"
    - ""
    - ":package: **Cheat Type:**"
    - "%check%"
    - ""
    - ":bar_chart: **VL**"
    - "%violations%"
    - ""
    - ":desktop: **Client:**"
    - "%brand%"
    - ""
    - ":pushpin: **Version:**"
    - "%version%"
    - ""
    - ":signal_strength: **PING | TPS:**"
    - "%ping% | %tps%"

  # Хочете, щоб Darkness надсилала повідомлення в Discord,
  # коли гравці караються під час Punish Wave?
  punishwave: false

  # Заголовок повідомлення про хвилю покарань
  punishwave_title: "**:fire: A WAVE OF NEW CHEATERS DETECTED!**"

  # Вміст повідомлення про хвилю покарань
  punishwave_content:
    - ":shield: **Server**"
    - "%server_name%"
    - ""
    - ":busts_in_silhouette: **Players Punished**"
    - "%players_punishwave%"
    - ""

  # Заголовок додаткового поля в повідомленні
  embed_field: "Information:"

# Connection Settings
connection_settings:

  # Чи затримувати або скасовувати пакети, якщо гравець починає сильно лагати?
  force_hold_server_packets: true

  # Затримка відповіді транзакції (у мілісекундах), після якої гравець вважається лагаючим
  enforce_latency_ms: 500

  # Скільки секунд без пакетів руху може пройти до видачі прапорця?
  enforce_flying_second: 4

  # Чи скасовувати удари, якщо гравець зазнає сильних мережевих затримок?
  cancel_hits: true

  # Чи блокувати обробку рухів гравця, якщо його затримка перевищує ліміти?
  block_movement: true

  # Чи припиняти надсилання даних світу (рух істот, блоки) лагаючому гравцеві?
  cancel_outbound_packets: false

# Client Settings
client_settings:

  # Client Alert Settings
  alert:

    # Чи надсилати сповіщення операторам при вході гравця із зазначенням його клієнта?
    enabled: true

    # Видаляє наступний регулярний вираз із назви клієнта
    remove: " \\(Velocity\\)$"

    # Це означає, що вона не транслюватиме його бренд операторам, якщо бренд відповідає наступним регулярним виразам
    ignored_clients:
      - "^badlion$"
      - "^optifine$"
      - "^vanilla$"
      - "^quilt$"
      - "^fabric$"
      - "^Feather Fabric$"
      - "(^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4}(,fabric)?$)|(^lunarclient:[a-z0-9]{7}/[\\w_/-]{3,32}$)"
      - "^labymod$"
      - "(?i)axolotl"
      - "^Ogulniega$"

  # Бренди клієнтів, що містять такі назви, будуть заблоковані від входу на сервер
  banned_clients:
    - "^1.12.2$"
    - "(?i)mcp"
    - "^ForgeOptiFine 1.16.5/forge/modified$"
    - ".*/.*"
    - "^(.)\\1+$"

  # Мінімальна та максимальна довжина назви бренду клієнта (формат: min:max)
  symbol_limiter: 5:16

  # Максимальний відсоток великих літер у назві бренду (-1 щоб вимкнути)
  # Рекомендовано не вимикати для виявлення підміни типу FORGE, VANILLA
  caps_percentage: 70

  # Білий список дозволених символів у назві бренду
  # Будь-який бренд із символами поза цим списком буде відхилено
  whitelist_regex: "^[a-zA-Z0-9:_/, .-]+$"

  # Чи блокувати чит клієнти за підозрілими ознаками та каналами?
  cheat_detector: true

  # Darkness блокуватиме клієнтів за назвами каналів корисного навантаження (payload)
  # Якщо зареєстрований канал містить ці ключові слова, вхід блокується
  payload:
    - "Remix"
    - "CRYSTAL"
    - "matrix"
    - "CrystalWare"
    - "Misplace"
    - "reach"
    - "lmaohax"
    - "Reach Mod"
    - "cock"
    - "Vape v3"
    - "1946203560"
    - "#unbanearwax"
    - "EARWAXWASHERE"
    - "Cracked Vape"
    - "EROUAXWASHERE"
    - "moon:exempt"
    - "Vape"
    - "WDL|INIT"
    - "WDL|CONTROL"
    - "Bspkrs Client"

  # Darkness вноситиме до чорного списку певні версії Forge із вбудованим Reach (1.18.2 — 1.19.3)
  # Вимкнення дозволить цим клієнтам входити на сервер (використовуйте на власний ризик)
  disconnect_blacklisted_forge_versions: true

# Чи повинні експериментальні перевірки перевіряти гравців?
# Якщо вимкнено, експериментальні перевірки не будуть активними
experimental_checks: false

# Чи вимкнути право на обхід перевірок (bypass permission)?
# Якщо увімкнено, Darkness перевірятиме всіх гравців, включаючи операторів
# Вимкніть це для підвищення продуктивності
disable_bypass_permission: false

# Чи логувати в консоль плагіни, що впровадилися в Netty при підключенні (для налагодження сумісності)?
debug_pipeline_on_join: false

# Alert Settings
alerts:

  # Окрім трансляції сповіщень гравцям, чи надсилати їх також у консоль?
  print_to_console: true

  # Proxy Alert Settings
  # Контролює передачу сповіщень між серверами, підключеними до проксі
  # Потрібно увімкнути 'bungee-plugin-message-channel' у конфігурації Velocity, якщо використовується Velocity
  proxy:

    # Чи надсилати сповіщення на інші сервери, підключені до вашого проксі?
    send: false

    # Чи оголошувати на цьому сервері сповіщення, отримані з інших серверів?
    receive: false

# Verbose Alert Settings
verbose:

  # Чи виводити детальні налагоджувальні повідомлення в консоль?
  print_to_console: false

# Punish Command Settings
punish_command:

  # Яку анімацію покарання повинна показувати Darkness перед виконанням команди нижче?
  # Анімації: NONE, THOR, FIRE, ERROR, SHAME, FLAME, BURN або RANDOM для випадкового вибору
  animation: NONE

  # Чи повинна Darkness оголошувати в чаті, коли гравець карається нею?
  broadcast: true

  # Яку команду повинна виконати Darkness після завершення анімації покарання? (%nl% для нового рядка)
  # Плейсхолдери: %prefix% -> (Префікс), %player% -> (Покараний гравець), %reason% -> (Причина покарання)
  command: darkness kick %player% %prefix% %reason%

# Punish Wave Settings
punishwave:

  # Чи увімкнути хвилю покарань?
  # Якщо хвилю покарань увімкнено, Darkness сама покарає всіх читерів одночасно
  # При виконанні /darkness punish гравець буде доданий до черги і покараний під час старту хвилі
  enabled: false

  # Чи повинна Darkness сповіщати про цю подію?
  broadcast: true

  # Як часто запускати хвилю покарань? (У хвилинах)
  time: 15

  # Зворотний відлік перед виконанням хвилі покарань (У секундах, -1 для вимкнення)
  countdown: 5

# Compatibility Settings
compatibility:

  # Чи увімкнути підтримку кросплатформенності (Geyser / Floodgate)?
  # Виключає гравців з Bedrock з деяких перевірок для запобігання хибним спрацьовуванням
  geyser: true

  # Чи дозволений мод ItemsScroller на клієнтах?
  # Запобігає хибним спрацьовуванням при швидкому переміщенні предметів
  itemsScroller: false

  # Чи дозволений мод TapeMouse на клієнтах?
  # Запобігає прапорцям на AFK-фермах, де кліки відбуваються з однаковими таймінгами
  tapeMouse: false

  # Чи дозволені макроси клавіш?
  # Допомагає уникнути хибних спрацьовувань при введенні команд на бігу
  keybind: false

  # Чи враховувати кінематографічну камеру?
  # Настійно рекомендується вимкнути, оскільки це послаблює перевірки ротацій
  # У реальному бою жоден гравець не використовує кінематографічну камеру
  account_cinematic: false

# Database Settings
database:

  # Тип бази даних для зберігання логів: SQLITE, MYSQL, MARIADB
  type: SQLITE

  # Налаштування MySQL / MariaDB (потрібен тип MYSQL або MARIADB)
  mysql:
    host: localhost
    port: 3306
    database: database
    user: root
    password: ''
    use_ssl: false

    # HikariCP Connection Pool Settings
    # Не змінюйте, якщо не впевнені у своїх діях
    pool_settings:
      maximum_pool_size: 15
      minimum_idle: 5
      maximum_lifetime: 1800000
      connection_timeout: 30000
      leak_detection_threshold: 0

# Log Settings
logs:

  # Режим зберігання логів: DATABASE, YAML_DAYS, YAML_ONE, NONE
  storage: DATABASE

  # Логи, старіші за вказану кількість днів, автоматично очищатимуться самою Darkness
  clear_days: 7

# Trust Factor Settings
trust:

  # Режим зберігання даних фактора довіри: DATABASE, NONE
  storage: DATABASE

# Packet Settings
# Низькорівневі ліміти пакетів, мережеві пороги та захист синхронізації
packet_settings:

  # Максимальна кількість пропущених транзакцій до кіку гравця
  # Спрацьовує на FreeCam, BackTrack, Blink
  transaction_skip: 400

  # Скільки секунд очікувати на відповідь на транзакцію до кіку за таймаутом?
  # За замовчуванням: 45 (допустимий діапазон: від 1 до 180)
  transaction_time: 45

  # Максимально допустимий негативний зсув таймера гравця до кіку (у мілісекундах)
  # Спрацьовує на Timer (0.1), Freeze
  negative_timer: 5000

  # Чи кікати за надсилання пакетів з неможливими координатами?
  invalid_packet_position: true

  # Чи кікати за надсилання некоректних кутів огляду, що створюють неможливий патерн руху?
  invalid_packet_rotation: true

  # Увімкніть це, щоб заборонити Darkness скасовувати pong-пакеты, отримані від гравців
  # Може покращити сумісність з іншими античитами, але може конфліктувати з лімітерами пакетів
  disable_pong_cancelling: false

  # Ліміт скасованих пакетів на секунду до кіку гравця
  # Допомагає запобігти перевантаженню сервера від спаму пакетами
  packet_spam_threshold: 100

  # Максимально допустимий пінг (у мілісекундах) при виході зі стану польоту
  max_ping_out_of_flying: 300

  # Максимальний пінг при знятті прискорення феєрверком на елітрах
  # Запобігає нескінченному польоту з одного феєрверку при високому пінгу
  max_ping_firework_boost: 1000

  # Active item usage reset settings
  reset_item_usage:

    # Скидати при оновленні предмета або інвентарю (запобігає NoSlow розсинхронізації)
    on_item_update: true

    # Скидати при атаці істоти (запобігає AutoBlock розсинхронізації)
    on_attack: true

    # Скидати при зміні слота хотбара
    on_slot_change: true

    # Скидати при використанні предмета
    on_item_use: true

# Packet Logger Settings
# Інструмент розробника для моніторингу пакетів гравців
packet_logger:

  # Чи повинна Darkness логувати пакети в консоль?
  enabled: false

  # Список гравців, чиї пакети записуватимуться в консоль
  whitelist:
    - 1hendex

  # Список пакетів, які слід ігнорувати
  # Назви відповідають класифікації PacketEvents
  # Шлях: https://github.com/retrooper/packetevents/blob/2.0/api/src/main/java/com/github/retrooper/packetevents/protocol/packettype/PacketType.java
  ignore:
    - WINDOW_CONFIRMATION
    - KEEP_ALIVE
    - PLAYER_FLYING
    - PONG
    - CLIENT_TICK_END

# Configuration Settings
config:

  # Чи перевіряти оновлення конфігурації при старті?
  checks_updates: true

  # Мова конфігурації
  lang: uk

  # Внутрішня версія конфігурації
  version: 5
