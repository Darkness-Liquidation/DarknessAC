# License Settings
license:

  # Ваш лицензионный ключ (предоставляется при покупке)
  api-key: "null"

  # Сервер API Darkness
  api-server: "https://api.darkness.rip/"

# Включить ли тестовый режим?
# Если этот режим включен, команды наказания, ротации и перемешивания слотов не будут работать
test_mode: false

# Тема оформления, которую будет использовать Darkness
theme: default

# Название сервера, отображаемое в логах и сообщениях Discord
server_name: Darkness Server

# Укажите названия команд для Darkness через запятую
# Первое имя в списке станет основной командой плагина
# Изменения применяются только после перезагрузки сервера
command_name: darkness,dl

# Discord Sync Settings
discord:

  # Синхронизировать ли Darkness с вашим сервером Discord через вебхук?
  enabled: false

  # Вставьте URL вебхука канала Discord
  webhook_url: ""

  # Заголовок сообщения об обнаружении
  embed_title: "**:fire: NEW CHEATER DETECTED!**"

  # Цвет полосы слева от сообщения (HEX-формат)
  embed_color: "#ff0000"

  # Содержимое сообщения о нарушении
  violation_content:
    - "%player%"
    - ""
    - ":shield: **Server Name:**"
    - "%server_name%"
    - ""
    - ":package: **Cheat Type:**"
    - "%check%"
    - ""
    - ":bar_chart: **VL**"
    - "%violations%"
    - ""
    - ":desktop: **Client:**"
    - "%brand%"
    - ""
    - ":pushpin: **Version:**"
    - "%version%"
    - ""
    - ":signal_strength: **PING | TPS:**"
    - "%ping% | %tps%"

  # Хотите, чтобы Darkness отправляла сообщения в Discord,
  # когда игроки наказываются во время Punish Wave?
  punishwave: false

  # Заголовок сообщения о волне наказаний
  punishwave_title: "**:fire: A WAVE OF NEW CHEATERS DETECTED!**"

  # Содержимое сообщения о волне наказаний
  punishwave_content:
    - ":shield: **Server**"
    - "%server_name%"
    - ""
    - ":busts_in_silhouette: **Players Punished**"
    - "%players_punishwave%"
    - ""

  # Заголовок дополнительного поля в сообщении
  embed_field: "Information:"

# Connection Settings
connection_settings:

  # Задерживать или отменять ли пакеты, если игрок начинает сильно лагать?
  force_hold_server_packets: true

  # Задержка ответа транзакции (в миллисекундах), после которой игрок считается лагающим
  enforce_latency_ms: 500

  # Сколько секунд без пакетов движения может пройти до выдачи флага?
  enforce_flying_second: 4

  # Отменять ли удары, если игрок испытывает сильные сетевые задержки?
  cancel_hits: true

  # Блокировать ли обработку движений игрока, если его задержка превышает лимиты?
  block_movement: true

  # Прекращать ли отправку данных мира (движение существ, блоки) лагающему игроку?
  cancel_outbound_packets: false

# Client Settings
client_settings:

  # Client Alert Settings
  alert:

    # Отправлять ли оповещение операторам при входе игрока с указанием его клиента?
    enabled: true

    # Удаляет следующее регулярное выражение из строки бренда клиента
    remove: " \\(Velocity\\)$"

    # Это означает, что она не будет транслировать свой бренд операторам, если бренд соответствует следующим регексам
    ignored_clients:
      - "^badlion$"
      - "^optifine$"
      - "^vanilla$"
      - "^quilt$"
      - "^fabric$"
      - "^Feather Fabric$"
      - "(^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4}(,fabric)?$)|(^lunarclient:[a-z0-9]{7}/[\\w_/-]{3,32}$)"
      - "^labymod$"
      - "(?i)axolotl"
      - "^Ogulniega$"

  # Бренды клиентов, содержащие следующие паттерны, будут заблокированы от входа на сервер
  banned_clients:
    - "^1.12.2$"
    - "(?i)mcp"
    - "^ForgeOptiFine 1.16.5/forge/modified$"
    - ".*/.*"
    - "^(.)\\1+$"

  # Минимальная и максимальная длина имени бренда клиента (формат: min:max)
  symbol_limiter: 5:16

  # Максимальный процент заглавных букв в названии бренда (-1 чтобы отключить)
  # Рекомендуется не отключать для обнаружения подмены типа FORGE, VANILLA
  caps_percentage: 70

  # Белый список допустимых символов в имени бренда
  # Любой бренд с символами вне этого списка будет отклонён
  whitelist_regex: "^[a-zA-Z0-9:_/, .-]+$"

  # Блокировать ли чит клиенты по подозрительным признакам и каналам?
  cheat_detector: true

  # Darkness блокирует клиентов по именам каналов полезной нагрузки (payload)
  # Если имя регистрируемого канала содержит эти слова, вход блокируется
  payload:
    - "Remix"
    - "forgewurst"
    - "CRYSTAL"
    - "matrix"
    - "CrystalWare"
    - "Misplace"
    - "reach"
    - "lmaohax"
    - "Reach Mod"
    - "cock"
    - "Vape v3"
    - "1946203560"
    - "#unbanearwax"
    - "EARWAXWASHERE"
    - "Cracked Vape"
    - "EROUAXWASHERE"
    - "moon:exempt"
    - "Vape"
    - "WDL|INIT"
    - "WDL|CONTROL"
    - "Bspkrs Client"

  # Darkness будет вносить в чёрный список определённые версии Forge со встроенным Reach (1.18.2 — 1.19.3)
  # Отключение позволит этим клиентам входить на сервер (используйте на свой страх и риск)
  disconnect_blacklisted_forge_versions: true

# Должны ли экспериментальные проверки проверять игроков?
# Если отключено, экспериментальные проверки не будут активны
experimental_checks: false

# Отключить ли право на обход проверок (bypass permission)?
# Если включено, Darkness будет проверять всех игроков, включая операторов
# Отключите это для повышения производительности
disable_bypass_permission: false

# Логировать ли в консоль плагины, внедрившиеся в Netty при подключении (для отладки совместимости)?
debug_pipeline_on_join: false

# Alert Settings
alerts:

  # Кроме трансляции оповещений игрокам, должны ли они также отправляться в консоль?
  print_to_console: true

  # Proxy Alert Settings
  # Контролирует передачу оповещений между серверами, подключенными к прокси
  # Требуется включенный 'bungee-plugin-message-channel' в конфигурации Velocity, если используется Velocity
  proxy:

    # Следует ли отправлять оповещения на другие серверы, подключенные к вашему прокси?
    send: false

    # Должны ли оповещения, полученные с других серверов, объявляться на этом сервере?
    receive: false

# Verbose Alert Settings
verbose:

  # Выводить ли подробные отладочные сообщения в консоль?
  print_to_console: false

# Punish Command Settings
punish_command:

  # Какую анимацию наказания должна показывать Darkness перед выполнением команды ниже?
  # Анимации: NONE, THOR, FIRE, ERROR, SHAME, FLAME, BURN или RANDOM для случайного выбора
  animation: NONE

  # Должна ли Darkness объявлять в чате, когда игрок наказывается ею?
  broadcast: true

  # Какую команду должна выполнить Darkness после завершения анимации наказания? (%nl% для новой строки)
  # Плейсхолдеры: %prefix% -> (Префикс), %player% -> (Наказанный игрок), %reason% -> (Причина наказания)
  command: darkness kick %player% %prefix% %reason%

# Punish Wave Settings
punishwave:

  # Включить ли волну наказаний?
  # Если волна наказаний включена, Darkness сама накажет всех читеров одновременно
  # При выполнении /darkness punish игрок будет добавлен в очередь и наказан при старте волны
  enabled: false

  # Должна ли Darkness оповещать об этом событии?
  broadcast: true

  # Как часто запускать волну наказаний? (В минутах)
  time: 15

  # Обратный отсчет перед выполнением волны наказаний (В секундах, -1 для отключения)
  countdown: 5

# Compatibility Settings
compatibility:

  # Включить ли поддержку кроссплатформенности (Geyser / Floodgate)?
  # Исключает игроков с Bedrock из некоторых проверок для предотвращения ложных срабатываний
  geyser: true

  # Разрешен ли мод ItemsScroller на клиентах?
  # Предотвращает ложные срабатывания при быстром перемещении предметов
  itemsScroller: false

  # Разрешен ли мод TapeMouse на клиентах?
  # Предотвращает флаги на AFK-фермах, где клики происходят с одинаковыми таймингами
  tapeMouse: false

  # Разрешены ли макросы клавиш?
  # Помогает избежать ложных срабатываний при вводе команд на бегу
  keybind: false

  # Учитывать ли кинематографическую камеру?
  # Настоятельно рекомендуется отключить, так как это ослабляет проверки ротаций
  # В реальном бою ни один игрок не использует кинематографическую камеру
  account_cinematic: false

# Database Settings
database:

  # Тип базы данных для хранения логов: SQLITE, MYSQL, MARIADB
  type: SQLITE

  # Настройки MySQL / MariaDB (требуется тип MYSQL или MARIADB)
  mysql:
    host: localhost
    port: 3306
    database: database
    user: root
    password: ''
    use_ssl: false

    # HikariCP Connection Pool Settings
    # Не изменяйте, если не уверены в своих действиях
    pool_settings:
      maximum_pool_size: 15
      minimum_idle: 5
      maximum_lifetime: 1800000
      connection_timeout: 30000
      leak_detection_threshold: 0

# Log Settings
logs:

  # Режим хранения логов: DATABASE, YAML_DAYS, YAML_ONE, NONE
  storage: DATABASE

  # Логи старше указанного количества дней будут автоматически очищаться самой Darkness
  clear_days: 7

# Trust Factor Settings
trust:

  # Режим хранения данных фактора доверия: DATABASE, NONE
  storage: DATABASE

# Packet Settings
# Низкоуровневые лимиты пакетов, сетевые пороги и защита синхронизации
packet_settings:

  # Максимальное количество пропущенных транзакций до кика игрока
  # Срабатывает на FreeCam, BackTrack, Blink
  transaction_skip: 400

  # Сколько секунд ожидать ответ на транзакцию до кика по таймауту?
  # По умолчанию: 45 (допустимый диапазон: от 1 до 180)
  transaction_time: 45

  # Максимально допустимый отрицательный сдвиг таймера игрока до кика (в миллисекундах)
  # Срабатывает на Timer (0.1), Freeze
  negative_timer: 5000

  # Кикать ли за отправку пакетов с невозможными координатами?
  invalid_packet_position: true

  # Кикать ли за отправку некорректных углов обзора, создающих невозможный паттерн движения?
  invalid_packet_rotation: true

  # Включите это, чтобы запретить Darkness отменять pong-пакеты, полученные от игроков
  # Может улучшить совместимость с другими античитами, но может конфликтовать с лимитерами пакетов
  disable_pong_cancelling: false

  # Лимит отмененных пакетов в секунду до кика игрока
  # Помогает предотвратить перегрузку сервера от спама пакетами
  packet_spam_threshold: 100

  # Максимально допустимый пинг (в миллисекундах) при выходе из состояния полета
  max_ping_out_of_flying: 300

  # Максимальный пинг при снятии ускорения фейерверком на элитрах
  # Предотвращает бесконечный полет с одного фейерверка при высоком пинге
  max_ping_firework_boost: 1000

  # Active item usage reset settings
  reset_item_usage:

    # Сбрасывать при обновлении предмета или инвентаря (предотвращает NoSlow рассинхрон)
    on_item_update: true

    # Сбрасывать при атаке существа (предотвращает AutoBlock рассинхрон)
    on_attack: true

    # Сбрасывать при смене слота хотбара
    on_slot_change: true

    # Сбрасывать при использовании предмета
    on_item_use: true

# Packet Logger Settings
# Инструмент разработчика для мониторинга пакетов игроков
packet_logger:

  # Должна ли Darkness логировать пакеты в консоль?
  enabled: false

  # Список игроков, чьи пакеты будут записываться в консоль
  whitelist:
    - 1hendex

  # Список пакетов, которые следует игнорировать
  # Названия соответствуют классификации PacketEvents
  # Путь: https://github.com/retrooper/packetevents/blob/2.0/api/src/main/java/com/github/retrooper/packetevents/protocol/packettype/PacketType.java
  ignore:
    - WINDOW_CONFIRMATION
    - KEEP_ALIVE
    - PLAYER_FLYING
    - PONG
    - CLIENT_TICK_END

# Configuration Settings
config:

  # Проверять ли обновления конфигурации при старте?
  checks_updates: true

  # Язык конфигурации
  lang: ru

  # Внутренняя версия конфигурации
  version: 5
