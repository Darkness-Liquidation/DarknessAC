# License Settings
license:

  # Your license key (provided upon purchase)
  api-key: "null"

  # Darkness API server URL
  api-server: "https://api.darkness.rip/"

# Should we enable the test mode?
# If this mode is enabled, the punish, rotate, and slot shuffle commands will not work
test_mode: false

# The theme that Darkness is going to use
theme: default

# The server name that will be shown in Player Logs and Discord Messages
server_name: Darkness Server

# Specify the name or names for the Darkness commands (separated by commas)
# The first name in the list will become the main command of the plugin
# Changes are applied only after a server restart
command_name: darkness,dl

# Discord Sync Settings
discord:

  # Would you like to sync Darkness to your Discord server via Webhook?
  enabled: false

  # Insert the Discord Channel Webhook URL
  webhook_url: ""

  # Message title for detection alerts
  embed_title: "**:fire: NEW CHEATER DETECTED!**"

  # Color of the stripe on the left side of the embed (HEX format)
  embed_color: "#ff0000"

  # Message content for violation alerts
  violation_content:
    - "%player%"
    - ""
    - ":shield: **Server Name:**"
    - "%server_name%"
    - ""
    - ":package: **Cheat Type:**"
    - "%check%"
    - ""
    - ":bar_chart: **VL**"
    - "%violations%"
    - ""
    - ":desktop: **Client:**"
    - "%brand%"
    - ""
    - ":pushpin: **Version:**"
    - "%version%"
    - ""
    - ":signal_strength: **PING | TPS:**"
    - "%ping% | %tps%"

  # Would you like Darkness to send Discord messages when players get punished in a Punish Wave?
  punishwave: false

  # Message title for Punish Wave alerts
  punishwave_title: "**:fire: A WAVE OF NEW CHEATERS DETECTED!**"

  # Message content for Punish Wave alerts
  punishwave_content:
    - ":shield: **Server**"
    - "%server_name%"
    - ""
    - ":busts_in_silhouette: **Players Punished**"
    - "%players_punishwave%"
    - ""

  # Title of the additional information field in the embed
  embed_field: "Information:"

# Connection Settings
connection_settings:

  # If true, the server will hold or cancel packets if the player starts lagging
  force_hold_server_packets: true

  # Transaction response delay (in milliseconds) after which a player is considered to be lagging
  enforce_latency_ms: 500

  # How many seconds can pass without movement packets before Darkness issues a flag?
  enforce_flying_second: 4

  # Should hits be cancelled if the player is experiencing severe network lag?
  cancel_hits: true

  # Enable this to block player movement processing if their latency exceeds the limits
  block_movement: true

  # If true, the server will stop sending world data (entity movement, blocks) to the lagging player
  cancel_outbound_packets: false

# Client Settings
client_settings:

  # Client Alert Settings
  alert:

    # Should we send an alert when a player joins specifying their Client Brand?
    enabled: true

    # Removes the following regex pattern from the client brand string
    remove: " \\(Velocity\\)$"

    # Brands matching the following regexes will not be announced to operators
    ignored_clients:
      - "^badlion$"
      - "^optifine$"
      - "^vanilla$"
      - "^quilt$"
      - "^fabric$"
      - "^Feather Fabric$"
      - "(^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4}(,fabric)?$)|(^lunarclient:[a-z0-9]{7}/[\\w_/-]{3,32}$)"
      - "^labymod$"
      - "(?i)axolotl"
      - "^Ogulniega$"

  # Client brands matching the following regex patterns will be prevented from joining the server
  banned_clients:
    - "^1.12.2$"
    - "(?i)mcp"
    - "^ForgeOptiFine 1.16.5/forge/modified$"
    - ".*/.*"
    - "^(.)\\1+$"

  # Minimum and maximum client brand name length (format: min:max)
  symbol_limiter: 5:16

  # Maximum allowed percentage of uppercase characters in brand name (set to -1 to disable)
  # Recommended to keep enabled to detect spoofing like FORGE, VANILLA
  caps_percentage: 70

  # Whitelist regex for allowable characters in client brand name
  # Any brand containing characters outside this regex will be rejected
  whitelist_regex: "^[a-zA-Z0-9:_/, .-]+$"

  # Should Darkness detect cheat clients by suspicious patterns and channel spoofing?
  cheat_detector: true

  # Darkness will block clients registering or sending payload channels containing any of these keywords
  payload:
    - "Remix"
    - "CRYSTAL"
    - "matrix"
    - "CrystalWare"
    - "Misplace"
    - "reach"
    - "lmaohax"
    - "Reach Mod"
    - "cock"
    - "Vape v3"
    - "1946203560"
    - "#unbanearwax"
    - "EARWAXWASHERE"
    - "Cracked Vape"
    - "EROUAXWASHERE"
    - "moon:exempt"
    - "Vape"
    - "WDL|INIT"
    - "WDL|CONTROL"
    - "Bspkrs Client"

  # Darkness will blacklist specific Forge versions that include built-in Reach hacks (Forge 1.18.2 - 1.19.3)
  # Setting this to false will allow these clients to connect to the server (Use at your own risk)
  disconnect_blacklisted_forge_versions: true

# Should experimental checks be enabled?
# If this setting is disabled, experimental checks will not check players
experimental_checks: false

# Should we disable the bypass permission?
# If enabled, Darkness will check all players, including operators
# Disable this for some performance gain
disable_bypass_permission: false

# Enable logging plugins that have injected into Netty on join to debug compatibility issues
debug_pipeline_on_join: false

# Alert Settings
alerts:

  # In addition to broadcasting alerts to players, should they also be sent to the console?
  print_to_console: true

  # Proxy Alert Settings
  # Controls whether/how alerts are shared between servers connected to your proxy
  # You must have 'bungee-plugin-message-channel' enabled in your Velocity configuration if Velocity is in use
  proxy:

    # Should alerts be sent to other servers connected to your proxy?
    send: false

    # Should alerts received from other servers be announced to this server?
    receive: false

# Verbose Alert Settings
verbose:

  # Should verbose debug messages be printed to the console?
  print_to_console: false

# Punish Command Settings
punish_command:

  # What punish animation should Darkness display before executing the below command?
  # Animations: NONE, THOR, FIRE, ERROR, SHAME, FLAME, BURN or RANDOM to let it choose a random animation each time
  animation: NONE

  # Should Darkness broadcast in chat when a player gets punished?
  broadcast: true

  # What command should Darkness execute once the punish animation ends? (%nl% for new line)
  # Placeholders: %prefix% -> (Darkness Prefix), %player% -> (The player that got punished), %reason% -> (The reason provided by the Darkness punish command)
  command: darkness kick %player% %prefix% %reason%

# Punish Wave Settings
punishwave:

  # Should the Punish Wave be enabled?
  # If the Punish Wave is enabled, Darkness will punish all cheaters at once
  # If a player is punished using the /darkness punish command while the Punish Wave is enabled,
  # they will be added to the queue and punished when the Punish Wave starts
  enabled: false

  # Should Darkness broadcast this event?
  broadcast: true

  # How often should the Punish Wave be executed? (In minutes)
  time: 15

  # The countdown before executing the Punish Wave (-1 to disable)
  countdown: 5

# Compatibility Settings
compatibility:

  # Enable if you have a cross-platform project (Geyser / Floodgate)
  # This will exclude Bedrock players from certain checks to avoid false positives
  geyser: true

  # Enable if you allow the ItemsScroller mod
  # This will prevent false positives during fast item movement
  itemsScroller: false

  # Enable if you allow the TapeMouse mod
  # This will prevent flags on AFK farms where hits occur at the same timing
  tapeMouse: false

  # Enable if you allow key macros
  # This will help avoid false positives when entering commands while walking
  keybind: false

  # Should cinematic camera be taken into account?
  # Highly recommended to keep this disabled as it makes aim checks less effective
  # In a real combat scenario, no player will fight using cinematic camera
  account_cinematic: false

# Database Settings
database:

  # What type of Database should Darkness use for logging?
  # Supported types: SQLITE, MYSQL, MARIADB
  type: SQLITE

  # MySQL / MariaDB Settings (Requires MYSQL or MARIADB type)
  mysql:
    host: localhost
    port: 3306
    database: database
    user: root
    password: ''
    use_ssl: false

    # HikariCP Connection Pool Settings
    # Do not change unless you know what you're doing
    pool_settings:
      maximum_pool_size: 15
      minimum_idle: 5
      maximum_lifetime: 1800000
      connection_timeout: 30000
      leak_detection_threshold: 0

# Log Settings
logs:

  # Storage mode: DATABASE, YAML_DAYS, YAML_ONE, NONE
  storage: DATABASE

  # Logs older than this value of Days will be cleared by Darkness
  clear_days: 7

# Trust Factor Settings
trust:

  # Storage mode: DATABASE, NONE
  storage: DATABASE

# Packet Settings
# Advanced packet thresholds, network checks and timing safeguards
packet_settings:

  # Maximum number of skipped transactions before the player is kicked
  # Triggers on FreeCam, BackTrack, Blink
  transaction_skip: 400

  # How many seconds players have before being kicked due to transaction timeout?
  # Default: 45 (Allowed range: 1 to 180)
  transaction_time: 45

  # Maximum allowed negative timer offset of the player before kicking (in milliseconds)
  # Triggers on Timer (0.1), Freeze
  negative_timer: 5000

  # Should Darkness kick players for sending packets with an impossible position?
  invalid_packet_position: true

  # Should Darkness kick players for sending invalid view angles that create an impossible movement pattern?
  invalid_packet_rotation: true

  # Enable this to prevent Darkness from cancelling pong packets received from players
  # Can improve compatibility with other anti-cheats, but may cause issues with packet limiters
  disable_pong_cancelling: false

  # Maximum number of cancelled packets per second before kicking the player
  # Helps prevent server overload from packet spam
  packet_spam_threshold: 100

  # Maximum allowed ping (in milliseconds) when a player exits flying state
  max_ping_out_of_flying: 300

  # Maximum allowed ping when a firework boost is removed from an elytra-flying player
  # Prevents high-latency players from maintaining firework boost indefinitely
  max_ping_firework_boost: 1000

  # Active item usage reset settings (prevents desync)
  reset_item_usage:

    # Reset when an item or inventory update occurs (helps prevent NoSlow desync)
    on_item_update: true

    # Reset when attacking an entity (helps prevent AutoBlock desync)
    on_attack: true

    # Reset when switching hotbar slots
    on_slot_change: true

    # Reset when using an item
    on_item_use: true

# Packet Logger Settings
# A logger for monitoring packets sent by players, useful for developers
packet_logger:

  # Should we enable the packet logger?
  enabled: false

  # Specify the players below whose packets will be logged to the console
  whitelist:
    - 1hendex

  # List of packets to ignore during logging
  # Path: https://github.com/retrooper/packetevents/blob/2.0/api/src/main/java/com/github/retrooper/packetevents/protocol/packettype/PacketType.java
  ignore:
    - WINDOW_CONFIRMATION
    - KEEP_ALIVE
    - PLAYER_FLYING
    - PONG
    - CLIENT_TICK_END

# Configuration Settings
config:

  # Should we check for configuration updates on startup?
  checks_updates: true

  # Configuration language
  lang: en

  # Internal configuration version
  version: 5
