## InformationHider Check
InformationHider:

  # Включить модуль скрытия информации?
  enabled: true

  # Проверять только игроков или всех сущностей?
  onlyForPlayers: true

  # Скрывает данные об игроках и мобах, чтобы чит-клиенты не могли получить лишнюю инфу.
  # На обычной игре это не заметно, но мешает читам.
  parts:
    # Спуфит здоровье — мобы и игроки всегда показывают фейковое здоровье
    # Полезно против хп-баров в модах и читах
    health:
      # Укажите значение, которое должна спуфить Darkness игрокам от 0 до 20.
      # При значении 0 множество KillAura будут сломаны, но ломает анимации ходьбы,
      # не советуется, если не хотите, чтобы игроки ходили "лунной походкой".
      # Установите -1, чтобы полностью отключить этот модуль
      value: 20
      # Если включено будет использоваться случайное значение от 0 до 20.
      # Менее заметно для игроков и лучше сохраняет процесс игры.
      random: false

    # Маскирует внутренние данные игрока, чтобы модули читов не могли их использовать.
    # Скрывает реальный уровень опыта, чтобы предотвратить отображение у читов.
    xp: true
    # Скрывает уровень кислорода, чтобы предотвратить отображение точного количества воздуха.
    air: true
    # Скрывает уровень сытости. Ломает работу функций AutoEat в чит-клиентах.
    saturation: true
    # Скрывает золотые сердечки поглощения от золотых яблок и эффектов.
    absorption: true
    # Скрывает реальный пинг в табе. Предотвращает некоторые обходы в модулях AntiBot.
    ping: true
    # Скрывает режим игры. Читы всегда будут видеть игрока в Creative.
    gamemode: true
    # Отправляет фейковый сид мира, чтобы читы не могли найти руды и структуры по сиду.
    seed: true

    # Скрывает данные о здоровье и статистике из скорбордов и таба.
    # Подменяет реальные показатели HP в списке игроков на фейковые.
    scoreboard:
      # Нужно ли маскировать здоровье в скорбордах и таб-листе?
      # Если InformationHider.parts.health.value установлен на -1, этот модуль отключится.
      enabled: true
      # Список паттернов имен задач в скорборде, которые нужно перехватывать.
      # Даркнесс ищет эти ключевые слова в названиях задач, чтобы понять, где отображается HP
      patterns:
        - "health"
        - "hp"
        - "hearts"
        - "TAB-BelowName"
        - "TAB-Sidebar"
        - "TAB-TabList"

    # Маскирует экипировку и визуальные эффекты игроков.
    # Скрывает зачарования на броне и предметах, чтобы читы не видели их тип и уровень.
    enchant: true
    # Скрывает точное количество предметов в руках и инвентаре.
    item_count: true
    # Заменяет настоящие названия предметов в руках на случайные.
    item_name: true
    # Скрывает названия и количество предметов, которые валяются на земле.
    item_drop: true
    # Всегда показывает полную прочность вещей, чтобы читы не видели износ брони.
    durability: true
    # Скрывает эффекты зелий от чужих глаз (чтобы не видели силу, скорость и т.д.).
    potion: true
    # Скрывает тип зелья в руках, второй руке или стрелах.
    potion_items: true
    # Спамит читу ложными пакетами эффектов, полностью забивая его PotionList мусором.
    end_effect: true

    # Спуфит название бренда сервера на экране отладки (F3) в Minecraft.
    # Полезно для отображения кастомных сообщений или скрытия софта вашего сервера.
    server_brand:
      # Включить подмену бренда сервера?
      enabled: true
      # Название бренда, которое видит клиент при подключении и на экране F3
      brand: "Server"

    # Скрывает игроков за стенами и блоками на уровне пакетов.
    # Ломает работу функций ESP, Tracers и Wallhack в чит-клиентах.
    #
    # ПРОИЗВОДИТЕЛЬНОСТЬ:
    # - В закрытых пространствах (пещеры, арены) модуль СНИЖАЕТ нагрузку на сеть и сервер,
    #   так как перестает отправлять пакеты движения скрытых игроков.
    # - При ВЫСОКОЙ концентрации игроков в одном месте проверку видимости через блоки
    #   может вызвать повышенную нагрузку на CPU.
    esp:

      # Нужно ли скрывать игроков за препятствиями?
      enabled: true
      # Максимальная дистанция (в блоках), на которой проверяется видимость игроков.
      # Чем меньше значение, тем ниже нагрузка на сервер.
      max_distance: 48.0
      # Горизонтальный угол обзора (в градусах) для проверки, виден ли игрок на экране.
      # Увеличьте для ультрашироких мониторов; 180 убирает ошибки по бокам экрана.
      max_fov: 165.0
      # Дистанция (в блоках) вокруг игрока, где все всегда видны.
      # Помогает избежать задержки прорисовки, когда игрок резко выбегает из-за угла.
      proximity_distance: 3.0
      # Задержка перед скрытием игрока за стеной (в тиках).
      # Предотвращает мерцание моделей на углах и сглаживает пинг.
      hide_delay_ticks: 5
      # Как часто пересчитывать видимость игроков (в тиках).
      # Низкие значения снижают производительность, высокие значения могут
      # привести к тому, что игроки будут слишком долго скрыты и внезапно появятся.
      interval_ticks: 2
      # Нужно ли скрывать звуки от скрытых за стеной игроков?
      hide_sounds: false
      # Нужно ли убирать подсветку контуров с игроков за стенами?
      hide_glowing: false
      # Настройки скрытия игроков, связанные с эффектами зелий.
      effects:
        # Скрывать ли игроков, когда у смотрящего есть эффект слепоты?
        blindness: true
        # Скрывать ли игроков, когда у смотрящего есть эффект тёмноты?
        darkness: true
        # Скрывать ли невидимых игроков, если у них нет предметов в руках и нет брони?
        # Сами частицы зелий при этом не скрываются, сохраняя ванильную механику обнаружения.
        invisible: true
      # Просчитывать ли обзор для режимов камеры от 3-го лица (F5)?
      # Предотвращает пропадание игроков при взгляде из-за угла.
      calculate_third_person_modes: true
      # По умолчанию ванильные никнеймы видны сквозь стены, если игрок не на шифте.
      # Если поставить false - будут скрываться вообще все игроки за стенами.
      # Значение true скрывает только тех, кто на шифте - это экономит CPU и не ломает неймтеги.
      only_sneaking: false
      # Список блоков, через которые игроки не будут скрываться.
      ignored_blocks:
        - "barrier"
        - "anvil"
        - "air"
        - "glass"
        - "pane"
        - "water"
        - "bubble_column"
        - "leaves"
        - "fence"
        - "trapdoor"
        - "door"
        - "lily_pad"
        - "web"
        - "ladder"
        - "iron_bars"
        - "bell"
        - "slime_block"
        - "honey_block"
        - "ice"

      # Список миров, в которых работа этого модуля будет полностью отключена.
      disabled_worlds:
        - ""

    # Перемешивает предметы в инвентаре во время движения, ломая работу AutoTotem, InvWalk.
    inventory: true
    # При открытии контейнера на мгновение скрывает все предметы,
    # Ломает логику ChestStealer, заставляя чит думать, что он закрывает пустой сундук.
    chest_loot: true

    # Спамит читу ложными пакетами взрывов тотемов.
    # Это позволяет ломать оповещения в читах о срабатывании тотема.
    totem:

      # Нужно ли ломать в читах TotemPopCounter?
      enabled: true
      # Режим работы модуля:
      # 1. duplicate - отправляет повторные пакеты взрыва на того же игрока.
      # 2. bot - спавнит фейков под землей в момент взрыва.
      mode: duplicate
      # Количество фейковых пакетов или ботов, создаваемых за один взрыв тотема.
      # Чем выше значение, тем сильнее заспамит экран читеру и сломает логику детекта в софте.
      amount: 1
      # Нужно ли спавнить фейковых ботов в таб-листе?
      # Если false, боты будут появляться только в мире, не мешая легитным игрокам.
      # Читы будут видеть взрывы тотемов, но боты не засорят таб-лист.
      # Работает только если в mode установлено BOT.
      spawn_tab: true
      # Укажите, на сколько блоков ниже игрока появится фейковый бот с тотемом.
      # Работает только если в mode установлено BOT.
      height: 15

    # Модуль создаёт фейковых модераторов в табе, чтобы скрыть настоящих модеров от читов.
    # Не переживайте эти боты существуют только на чит-клиенте, реальные игроки их не видят.
    fake_staff:
      # Нужно ли создавать фейковых ботов для маскировки реальной администрации?
      enabled: true
      # Если true, Darkness всегда будет создавать ботов со случайными именами.
      # Это улучшает совместимость с некоторыми серверами, но иногда позволяет обойти StaffList.
      only_random_name: false
      # Укажите настоящие префиксы вашей модерации, которые будут отображаться у фейковых ботов.
      roles:
        - "&cAdmin"
        - "&cStaff"
        - "&cHelper"
        - "&cModer"
      # Рекомендуется ставить значение >= 60, чтобы читы не могли отфильтровать настоящих модераторов.
      bots: 60

    # Настройки зрителей (с permission: darkness.spectator)
    spectators:
      # Будет делать зрителей скрытыми только в этих мирах. Оставьте пустым, чтобы разрешить все миры
      allowed_worlds:
        - ""
      # Скрыть всех зрителей с разрешением darkness.spectator, независимо от того, являются ли они активными зрителями.
      hide_spectators: true

hider:
  checks_updates: true
  lang: ru
  version: 1
